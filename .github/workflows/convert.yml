name: Gemma4 anlord INT4 donustur
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Hugging Face model"
        default: "anlord/gemma-4-E2B-it-abliterated"
      recipe:
        description: "dynamic_wi4_afp32 (INT4) veya dynamic_wi8_afp32 (INT8)"
        default: "dynamic_wi4_afp32"
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Disk ac
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Swap ac
        run: |
          df -h / /mnt
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g
          df -h / /mnt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: pip install -q "litert-torch==0.10.0" litert-lm tf-nightly "huggingface_hub[cli]"
      - name: Modeli indir
        run: |
          python - <<PY
          from huggingface_hub import snapshot_download
          snapshot_download("${{ inputs.model }}", local_dir="model")
          PY
          df -h /
      - name: Donustur
        run: |
          mkdir -p out
          # Bellek siniri: asilirsa runner degil sadece donusum sureci olur
          if sudo systemd-run --scope -q -p MemoryMax=13G -p MemorySwapMax=18G --uid=$(id -u) --gid=$(id -g) true 2>/dev/null; then
            LIM="sudo systemd-run --scope -q -p MemoryMax=13G -p MemorySwapMax=18G --uid=$(id -u) --gid=$(id -g) --setenv=PATH=$PATH --setenv=HOME=$HOME --working-directory=$PWD"
          else
            LIM=""
          fi
          echo "LIM=$LIM"
          # Gemma4 icin externalize_embedder ZORUNLU; varsayilan dtype float32 (~20 GB) 16 GB RAM'e sigmaz -> bf16
          EMB="--externalize_embedder=True --single_token_embedder=True"
          run() { rm -rf out/*; timeout 70m $LIM nice -n 10 litert-torch export_hf --model=model --output_dir=out "$@" --quantization_recipe=${{ inputs.recipe }} --cache_length=4096 --bundle_litert_lm=True 2>&1 | grep --line-buffered -v "is part of .* signature, but not documented"; echo "exit=${PIPESTATUS[0]}"; free -g; }
          found() { find out -name '*.litertlm' | head -1; }
          # NOT: bf16 yalnizca V2 ile calisir (eski donusturucu "unsupported ScalarType BFloat16" verir); V2 icin tf-nightly gerekir
          echo ">>> v2 + bf16 + akitma (en az RAM)"; run --use_v2=True --delete_in_memory_params=True --model_dtype=bfloat16 $EMB || true
          [ -n "$(found)" ] || { echo ">>> v2 + bf16"; run --use_v2=True --model_dtype=bfloat16 $EMB || true; }
          [ -n "$(found)" ] || { echo ">>> eski donusturucu fp32"; run $EMB || true; }
          [ -n "$(found)" ] || { echo ">>> gorsel fp32"; run --task=image_text_to_text || true; }
          F=$(found); [ -n "$F" ] || { echo "HATA: .litertlm uretilemedi"; exit 1; }
          cp "$F" gemma4-anlord.litertlm
          ls -l gemma4-anlord.litertlm
      - name: Kisa test
        run: |
          timeout 20m litert-lm run gemma4-anlord.litertlm --prompt "Turkiye'nin baskenti neresidir? Tek cumleyle cevapla." 2>&1 | tail -5 || echo "UYARI: kisa test basarisiz/zaman asimi; model yine de Release'e yuklenecek"
      - name: Parcala
        run: |
          split -b 1900M -d gemma4-anlord.litertlm gemma4-anlord.litertlm.part
          ls -l gemma4-anlord.litertlm.part*
      - name: Release yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "model-${{ github.run_number }}" gemma4-anlord.litertlm.part* --repo "${{ github.repository }}" --title "Gemma4 anlord ${{ inputs.recipe }}" --notes "Birlestirmek icin: cat gemma4-anlord.litertlm.part* > gemma4-anlord.litertlm"
